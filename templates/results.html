<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><title>HookMeme — Résultats</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0e;--panel:#161616;--card:#1e1e1e;--card2:#242424;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --text:#e8e8e8;--muted:#555;--muted2:#888;
  --blue:#3b82f6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif}

header{position:sticky;top:0;height:46px;background:rgba(14,14,14,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;z-index:200}
.logo{font-size:14px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:7px;margin-right:4px}
.logo-dot{width:7px;height:7px;border-radius:50%;background:#e8e8e8}
.sep{width:1px;height:18px;background:var(--border);flex-shrink:0}
a.nav,button.nav{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:6px;border:none;background:transparent;color:var(--muted2);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;text-decoration:none;white-space:nowrap}
a.nav:hover,button.nav:hover,a.nav.on,button.nav.on{background:rgba(255,255,255,.06);color:var(--text)}
.nav svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.counter{font-size:11px;color:var(--muted2)}
.counter span{color:var(--text);font-weight:600}

.toolbar{position:sticky;top:46px;z-index:100;background:rgba(14,14,14,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:0}
.stats-inline{display:flex;gap:32px;padding:14px 0;border-right:1px solid var(--border);margin-right:20px;padding-right:24px}
.si{text-align:center}
.si-val{font-size:22px;font-weight:700;line-height:1}
.si-lbl{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.filters{display:flex;gap:4px}
.fb{padding:6px 14px;border-radius:6px;border:none;background:transparent;color:var(--muted2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.fb:hover{color:var(--text)}
.fb.on{background:rgba(255,255,255,.08);color:var(--text)}
.search{margin-left:auto;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.35;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
#q{background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:7px 12px 7px 32px;font-size:13px;width:220px;outline:none}
#q:focus{border-color:rgba(255,255,255,.2)}

.content{padding:32px 24px 80px}
.day-group{margin-bottom:48px}
.day-hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.day-lbl{font-size:13px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em}
.day-lbl.today{color:var(--green)}
.day-n{font-size:11px;color:var(--muted2);background:var(--card);border:1px solid var(--border);padding:2px 10px;border-radius:10px}
.day-line{flex:1;height:1px;background:var(--border)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}

.vcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.vcard:hover{border-color:var(--border2);transform:translateY(-3px)}
.thumb{position:relative;aspect-ratio:9/16;background:#000;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--card2)}
.thumb-ph svg{opacity:.15}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;background:rgba(0,0,0,.45);transition:opacity .15s}
.vcard:hover .ov{opacity:1}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.b-auto{background:rgba(34,197,94,.85);color:#000}
.b-manual{background:rgba(59,130,246,.85);color:#fff}
.info{padding:13px 13px 10px}
.fn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.hook-txt{font-size:11px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:7px;font-style:italic}
.meta{font-size:11px;color:var(--muted2);display:flex;justify-content:space-between}
.actions{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border)}
.ab{flex:1;padding:7px 0;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:11px;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:4px}
.ab:hover{color:var(--text);border-color:var(--border2)}
.ab.e:hover{color:var(--amber);border-color:rgba(245,158,11,.35)}
.ab.d:hover{color:var(--red);border-color:rgba(239,68,68,.35)}
.ab svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

/* MODALS */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center}
.mbg.h{display:none}
.mbox{background:var(--panel);border:1px solid var(--border2);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.mhdr-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.mclose{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:16px;line-height:1;padding:2px 5px;border-radius:4px}
.mclose:hover{color:var(--text)}

/* PREVIEW */
#prevBox{width:380px;max-width:94vw}
.phone-wrap{display:flex;justify-content:center;padding:16px;background:var(--bg)}
.phone{width:170px;background:#111;border-radius:24px;border:2px solid #272727;overflow:hidden;box-shadow:0 0 0 4px #181818}
.phone-notch{height:16px;background:#111;display:flex;align-items:center;justify-content:center}
.phone-notch::after{content:'';width:44px;height:7px;background:#1e1e1e;border-radius:6px}
.phone video{width:100%;aspect-ratio:9/16;display:block;background:#000}
.mmeta{padding:10px 16px;font-size:11px;color:var(--muted2);line-height:1.9}
.mmeta strong{color:var(--text)}
.mfoot{display:flex;gap:7px;padding:11px 16px;border-top:1px solid var(--border)}
.btn-blue{flex:1;padding:8px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.btn-blue:hover{background:#2563eb}
.btn-red{padding:8px 14px;background:transparent;color:var(--red);border:1px solid rgba(239,68,68,.3);border-radius:6px;font-size:12px;cursor:pointer}
.btn-red:hover{background:rgba(239,68,68,.1)}

/* EDITOR */
#editBox{width:520px;max-width:95vw}
.ebody{display:grid;grid-template-columns:130px 1fr}
.eprev{padding:14px 12px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px}
.ephone{width:100px;background:#111;border-radius:16px;border:2px solid #272727;overflow:hidden;box-shadow:0 0 0 3px #181818}
.ephone-notch{height:12px;background:#111;display:flex;align-items:center;justify-content:center}
.ephone-notch::after{content:'';width:34px;height:6px;background:#1e1e1e;border-radius:5px}
.ephone img{width:100%;aspect-ratio:9/16;display:block;object-fit:cover;background:#000}
.esrc{font-size:9px;color:var(--muted);text-align:center;line-height:1.4;word-break:break-all}
.ectrl{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.flbl{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.finp{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:7px 10px;font-size:12px;outline:none;transition:border-color .12s}
.finp:focus{border-color:rgba(255,255,255,.22)}
.pos-row{display:flex;gap:4px}
.pb{flex:1;padding:6px 4px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:10px;cursor:pointer;transition:all .12s;text-align:center}
.pb:hover{border-color:var(--border2);color:var(--text)}
.pb.on{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.4);color:var(--blue)}
.dur-row{display:flex;align-items:center;gap:8px}
.dur-row input{flex:1;accent-color:var(--blue);cursor:pointer}
.dur-val{font-size:12px;font-weight:700;color:var(--blue);min-width:28px;text-align:right}
.eprog{display:none;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted2)}
.eprog.on{display:flex}
.pbar{flex:1;height:3px;background:var(--card2);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:var(--blue);width:0%;transition:width .3s}
.efoot{display:flex;gap:7px;padding:11px 16px;border-top:1px solid var(--border)}

/* EMPTY / LOADING */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;color:var(--muted2)}
.empty h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty p{font-size:12px;max-width:260px;line-height:1.6;margin-bottom:16px}
.empty a{padding:7px 18px;background:var(--blue);color:#fff;border-radius:6px;text-decoration:none;font-size:12px;font-weight:600}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted2);gap:8px;font-size:12px}
.spin{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;background:var(--card2);border:1px solid var(--border2);border-radius:7px;padding:9px 14px;font-size:12px;z-index:9999;transform:translateY(40px);opacity:0;transition:all .2s;pointer-events:none}
.toast.on{transform:translateY(0);opacity:1}
.toast.ok{border-color:rgba(34,197,94,.4);color:var(--green)}
.toast.err{border-color:rgba(239,68,68,.4);color:var(--red)}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>HookMeme</div>
  <div class="sep"></div>
  <a href="/" class="nav"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Studio</a>
  <button class="nav on"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Résultats</button>
  <a href="/team" class="nav"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>Equipe</a>
  <div class="hdr-right">
    <div class="counter"><span id="hTotal">—</span> vidéos générées</div>
  </div>
</header>

<div class="toolbar">
  <div class="stats-inline">
    <div class="si"><div class="si-val" id="sTotal">—</div><div class="si-lbl">Total</div></div>
    <div class="si"><div class="si-val" id="sWeek">—</div><div class="si-lbl">7 jours</div></div>
    <div class="si"><div class="si-val" id="sToday">—</div><div class="si-lbl">Aujourd'hui</div></div>
    <div class="si"><div class="si-val" id="sAuto">—</div><div class="si-lbl">Auto</div></div>
  </div>
  <div class="filters">
    <button class="fb on" data-f="all">Tous</button>
    <button class="fb" data-f="auto">Auto IA</button>
    <button class="fb" data-f="manual">Manuel</button>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="q" placeholder="Rechercher…"/>
  </div>
</div>

<div class="content" id="content">
  <div class="loading"><div class="spin"></div>Chargement…</div>
</div>

<!-- PREVIEW -->
<div class="mbg h" id="prevModal">
  <div class="mbox" id="prevBox" onclick="event.stopPropagation()">
    <div class="mhdr"><div class="mhdr-title" id="prevTitle">Aperçu</div><button class="mclose" onclick="closePrev()">✕</button></div>
    <div class="phone-wrap"><div class="phone"><div class="phone-notch"></div><video id="prevVid" controls playsinline></video></div></div>
    <div class="mmeta" id="prevMeta"></div>
    <div class="mfoot">
      <button class="btn-blue" onclick="dlCur()">Télécharger</button>
      <button class="btn-red" onclick="delCur()">Supprimer</button>
    </div>
  </div>
</div>

<!-- EDITOR -->
<div class="mbg h" id="editModal">
  <div class="mbox" id="editBox" onclick="event.stopPropagation()">
    <div class="mhdr"><div class="mhdr-title" id="editTitle">Modifier la vidéo</div><button class="mclose" onclick="closeEdit()">✕</button></div>
    <div class="ebody">
      <div class="eprev">
        <div class="ephone"><div class="ephone-notch"></div><img id="eThumb" src="" alt=""/></div>
        <div class="esrc" id="eSrc"></div>
      </div>
      <div class="ectrl">
        <div>
          <div class="flbl">Texte du hook</div>
          <input type="text" class="finp" id="eHook" placeholder="Ex: ATTENDS LA FIN..."/>
        </div>
        <div>
          <div class="flbl">Position</div>
          <div class="pos-row">
            <button class="pb" data-p="top" onclick="setPos('top')">Haut</button>
            <button class="pb on" data-p="center" onclick="setPos('center')">Milieu</button>
            <button class="pb" data-p="bottom" onclick="setPos('bottom')">Bas</button>
          </div>
        </div>
        <div>
          <div class="flbl">Durée (secondes)</div>
          <div class="dur-row">
            <input type="range" id="eDur" min="2" max="15" value="6" oninput="document.getElementById('eDurV').textContent=this.value+'s'"/>
            <span class="dur-val" id="eDurV">6s</span>
          </div>
        </div>
      </div>
    </div>
    <div class="eprog" id="eProg"><div class="spin"></div><span id="eProgTxt">Génération…</span><div class="pbar"><div class="pfill" id="eBar"></div></div></div>
    <div class="efoot">
      <button class="btn-blue" id="eBtn" onclick="submitEdit()">Regénérer</button>
      <button class="btn-red" onclick="closeEdit()">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let H=[], filter='all', q='', cur=null, editE=null, ePos='center', ePoll=null;

async function load(){
  try{ H=await(await fetch('/api/history')).json(); }catch{ H=[]; }
  stats(); render();
}

function stats(){
  const now=new Date(), tk=fk(now), wa=new Date(now); wa.setDate(now.getDate()-7);
  let t=H.length,w=0,td=0,a=0;
  for(const e of H){ const d=new Date(e.generated_at); if(d>=wa)w++; if(fk(d)===tk)td++; if(e.auto)a++; }
  set('sTotal',t); set('sWeek',w); set('sToday',td); set('sAuto',a); set('hTotal',t);
}
function set(id,v){ document.getElementById(id).textContent=v; }

function fk(d){ return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function p(n){ return String(n).padStart(2,'0'); }
function dayLabel(key){
  const [y,m,d]=key.split('-').map(Number), dt=new Date(y,m-1,d);
  const now=new Date(), tk=fk(now), yk=fk(new Date(Date.now()-86400000));
  if(key===tk) return{l:"Aujourd'hui",t:true};
  if(key===yk) return{l:'Hier',t:false};
  return{l:dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}),t:false};
}

function vis(){
  return H.filter(e=>{
    if(filter==='auto'&&!e.auto)return false;
    if(filter==='manual'&&e.auto)return false;
    if(q){ const s=(e.filename+' '+(e.hook||'')+' '+(e.source||'')).toLowerCase(); if(!s.includes(q.toLowerCase()))return false; }
    return true;
  });
}

function render(){
  const ct=document.getElementById('content'), items=vis();
  if(!items.length){
    const empty=H.length===0;
    ct.innerHTML=`<div class="empty"><h3>${empty?'Aucune vidéo générée':'Aucun résultat'}</h3><p>${empty?'Génère ta première vidéo depuis le Studio.':'Essaie un autre filtre ou terme de recherche.'}</p>${empty?'<a href="/">Aller au Studio</a>':''}</div>`;
    return;
  }
  const g={};
  for(const e of items){ const k=fk(new Date(e.generated_at)); (g[k]=g[k]||[]).push(e); }
  const keys=Object.keys(g).sort((a,b)=>b.localeCompare(a));
  ct.innerHTML=keys.map(k=>{
    const{l,t}=dayLabel(k), arr=g[k];
    return`<div class="day-group">
      <div class="day-hdr"><div class="day-lbl${t?' today':''}">${l}</div><div class="day-n">${arr.length} vidéo${arr.length>1?'s':''}</div><div class="day-line"></div></div>
      <div class="grid">${arr.map(card).join('')}</div>
    </div>`;
  }).join('');
  ct.querySelectorAll('.vcard').forEach(c=>c.addEventListener('click',ev=>{ if(ev.target.closest('.ab'))return; openPrev(c.dataset.id); }));
  ct.querySelectorAll('.ae').forEach(b=>b.addEventListener('click',ev=>{ ev.stopPropagation(); openEdit(b.dataset.id); }));
  ct.querySelectorAll('.adl').forEach(b=>b.addEventListener('click',ev=>{ ev.stopPropagation(); dlById(b.dataset.id); }));
  ct.querySelectorAll('.adel').forEach(b=>b.addEventListener('click',ev=>{ ev.stopPropagation(); delById(b.dataset.id,true); }));
}

function card(e){
  const t=new Date(e.generated_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const th=e.thumbnail?`<img src="${e.thumbnail}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=thumb-ph><svg width=32 height=32 viewBox=\\'0 0 24 24\\' fill=none stroke=rgba(255,255,255,.1) stroke-width=1.5><rect x=2 y=3 width=20 height=14 rx=2/></svg></div>'">`:'<div class="thumb-ph"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/></svg></div>';
  const fn=e.filename.length>21?e.filename.slice(0,19)+'…':e.filename;
  const hk=(e.hook||'').length>25?(e.hook||'').slice(0,23)+'…':(e.hook||'');
  return`<div class="vcard" data-id="${e.id}">
    <div class="thumb">${th}<div class="badge ${e.auto?'b-auto':'b-manual'}">${e.auto?'Auto':'Manuel'}</div><div class="ov"><svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.55)"/><polygon points="10,8 16,12 10,16" fill="white"/></svg></div></div>
    <div class="info"><div class="fn" title="${e.filename}">${fn}</div>${hk?`<div class="hook-txt">${hk}</div>`:''}<div class="meta"><span>${t}</span><span>${e.meme_mode==='fit'?'fit':'fill'}</span></div></div>
    <div class="actions">
      <button class="ab e ae" data-id="${e.id}"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></svg>Modifier</button>
      <button class="ab adl" data-id="${e.id}"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>DL</button>
      <button class="ab d adel" data-id="${e.id}"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
    </div>
  </div>`;
}

function openPrev(id){
  const e=H.find(x=>x.id===id); if(!e)return; cur=e;
  set('prevTitle',e.filename);
  const v=document.getElementById('prevVid'); v.src=`/api/video/outputs/${e.filename}`; v.load();
  const d=new Date(e.generated_at);
  document.getElementById('prevMeta').innerHTML=`<div><strong>Hook :</strong> ${e.hook||'—'}</div><div><strong>Source :</strong> ${e.source||'—'}</div><div><strong>Méthode :</strong> ${e.auto?'Auto IA':'Manuel'}</div><div><strong>Généré le :</strong> ${d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} à ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>`;
  document.getElementById('prevModal').classList.remove('h');
}
function closePrev(){ document.getElementById('prevModal').classList.add('h'); document.getElementById('prevVid').pause(); document.getElementById('prevVid').src=''; cur=null; }

async function dlById(id){ const e=H.find(x=>x.id===id); if(e) await dl(e.filename); }
async function dlCur(){ if(cur) await dl(cur.filename); }
async function dl(fn){
  try{
    const r=await fetch(`/api/download/${fn}`); if(!r.ok)throw 0;
    const blob=await r.blob(), url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=fn; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Téléchargement démarré','ok');
  }catch{ toast('Erreur téléchargement','err'); }
}

async function delById(id,confirm_){
  if(confirm_){ const e=H.find(x=>x.id===id); if(!e||!confirm(`Supprimer "${e.filename}" ?`))return; }
  await fetch(`/api/history/${id}`,{method:'DELETE'});
  H=H.filter(e=>e.id!==id); stats(); render(); toast('Supprimé','ok');
}
async function delCur(){ if(!cur)return; const id=cur.id; closePrev(); await delById(id,true); }

function openEdit(id){
  const e=H.find(x=>x.id===id); if(!e)return; editE=e; ePos=e.hook_position||'center';
  set('editTitle','Modifier — '+e.filename);
  document.getElementById('eHook').value=e.hook||'';
  document.getElementById('eSrc').textContent=e.source||'';
  document.getElementById('eThumb').src=e.thumbnail||'';
  const dur=e.cut_seconds||6;
  document.getElementById('eDur').value=dur; set('eDurV',dur+'s');
  document.querySelectorAll('.pb').forEach(b=>b.classList.toggle('on',b.dataset.p===ePos));
  document.getElementById('eProg').classList.remove('on');
  document.getElementById('eBtn').disabled=false; set('eBtn','Regénérer');
  document.getElementById('editModal').classList.remove('h');
}
function closeEdit(){ clearInterval(ePoll); document.getElementById('editModal').classList.add('h'); editE=null; }
function setPos(p){ ePos=p; document.querySelectorAll('.pb').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); }
async function submitEdit(){
  if(!editE)return;
  document.getElementById('eBtn').disabled=true; set('eBtn','En cours…');
  document.getElementById('eProg').classList.add('on');
  set('eProgTxt','Démarrage…'); document.getElementById('eBar').style.width='0%';
  try{
    const r=await fetch('/api/reedit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      history_id:editE.id, hook_text:document.getElementById('eHook').value.trim(),
      hook_position:ePos, cut_seconds:parseInt(document.getElementById('eDur').value)
    })});
    const d=await r.json();
    if(!r.ok){ toast(d.error||'Erreur','err'); document.getElementById('eBtn').disabled=false; set('eBtn','Regénérer'); return; }
    ePoll=setInterval(async()=>{
      const j=await(await fetch('/api/job/'+d.job_id)).json();
      set('eProgTxt',j.message||'…'); document.getElementById('eBar').style.width=j.status==='done'?'100%':'55%';
      if(j.status==='done'){ clearInterval(ePoll); toast('Nouvelle version créée','ok'); closeEdit(); load(); }
      if(j.status==='error'){ clearInterval(ePoll); toast(j.message,'err'); document.getElementById('eBtn').disabled=false; set('eBtn','Regénérer'); }
    },900);
  }catch{ toast('Erreur réseau','err'); document.getElementById('eBtn').disabled=false; set('eBtn','Regénérer'); }
}

document.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('.fb').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filter=b.dataset.f; render(); }));
document.getElementById('q').addEventListener('input',e=>{ q=e.target.value.trim(); render(); });
document.getElementById('prevModal').addEventListener('click',e=>{ if(e.target===document.getElementById('prevModal'))closePrev(); });
document.getElementById('editModal').addEventListener('click',e=>{ if(e.target===document.getElementById('editModal'))closeEdit(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePrev(); closeEdit(); } });

let _tt;
function toast(msg,type){
  const el=document.getElementById('toast'); el.textContent=msg; el.className='toast on '+(type||'');
  clearTimeout(_tt); _tt=setTimeout(()=>el.className='toast',3000);
}

load();
setInterval(()=>{ if(!document.hidden)load(); },30000);
</script>
</body>
</html>
